<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th colspan="4" title="Student information">Student Details</th>
        </tr>

        <tr>
            <td rowspan="2"><strong>Student Name</strong></td>
            <td>Arti Mini</td>
            <th>Class</th>
            <td>12th</td>
        </tr>

        <tr>
            <th>Roll No.</th>
            <td colspan="2">101</td>
        </tr>

        <tr>
            <th colspan="4" title="Marks obtained in each subject">Subject Marks</th>
        </tr>

        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>95</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>88</td>
            <td>A</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td colspan="2">440 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td colspan="2">88%</td>
        </tr>

    </table>

</body>
</html>
