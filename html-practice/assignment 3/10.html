<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="japan">Japan</option>
        <option value="france">France</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="goa">Goa</option>
        <option value="kerala">Kerala</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="agra" selected>Agra</option>
        <option value="jaipur">Jaipur</option>
        <option value="lucknow">Lucknow</option>
        <option value="varanasi">Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="amer-fort">Amer Fort</option>
        <option value="goa-beach">Goa Beach</option>
        <option value="gateway">Gateway of India</option>
    </select>

    <br><br>

    <p>
        <strong>My Travel Choices:</strong>
        I have selected India as my country, Uttar Pradesh as my state,
        Agra as my city, and the Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
