<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="Arti Tripathi"
               placeholder="Enter your full name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="mghyuft@gmail.com"
               placeholder="Enter your email" required>

    </form>

</body>
