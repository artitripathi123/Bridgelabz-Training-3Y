<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <p>
        Less than : &lt; <br>
        Greater than : &gt; <br>
        Ampersand : &amp; <br>
        Double quotation mark : &quot; <br>
        Single quotation mark : &apos; <br>
        Copyright : &copy; <br>
        Trademark : &trade; <br>
        Registered trademark : &reg;
    </p>

</body>
</html>
