<!DOCTYPE html>
<html>
<head>

    <!-- <title> defines the title shown in the browser tab -->
    <title>HTML Head Elements</title>

    <!-- <meta charset> defines the character encoding as UTF-8 -->
    <meta charset="UTF-8">

    <!-- <meta name="description"> provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- <meta name="author"> specifies the author of the webpage -->
    <meta name="author" content="Student">

    <!-- <base> sets the base URL for relative links in the webpage -->
    <base href="https://example.com/">

    <!-- <link> connects the webpage to an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- <style> is used to write CSS styles for the webpage -->
    <style>
    </style>

    <!-- <script> is used to add JavaScript to the webpage -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>This page demonstrates the important elements used inside the HTML head section.</p>

</body>
</html>
