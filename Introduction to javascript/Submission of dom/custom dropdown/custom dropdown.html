
<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>

    <style>
        #options {
            display: none;
            width: 150px;
            border: 1px solid black;
        }

        .option {
            padding: 10px;
            cursor: pointer;
        }

        .option:hover {
            background: lightblue;
        }
    </style>
</head>
<body>

    <h2>Custom Dropdown</h2>

    <div id="dropdown">

        <button id="dropdownButton">
            Select Option
        </button>

        <div id="options">

            <div class="option">HTML</div>
            <div class="option">CSS</div>
            <div class="option">JavaScript</div>
            <div class="option">Java</div>

        </div>

    </div>

    <script src="Q8.js"></script>
</body>
</html>
