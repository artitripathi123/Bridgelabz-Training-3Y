
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }

        .gallery img {
            width: 150px;
            height: 120px;
            cursor: pointer;
            object-fit: cover;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            width: 500px;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery" id="gallery">

        <img src="https://picsum.photos/id/10/300/200">
        <img src="https://picsum.photos/id/20/300/200">
        <img src="https://picsum.photos/id/30/300/200">
        <img src="https://picsum.photos/id/40/300/200">
        <img src="https://picsum.photos/id/50/300/200">
        <img src="https://picsum.photos/id/60/300/200">

    </div>

    <div id="modal">
        <img id="previewImage">
    </div>

    <script src="Q5.js"></script>
</body>
</html>
