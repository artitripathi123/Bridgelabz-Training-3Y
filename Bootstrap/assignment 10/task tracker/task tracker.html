
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="task tracker.css">
</head>
<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Task Tracker</h1>

            <span class="badge bg-danger fs-6">
                Pending: 3
            </span>
        </div>

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">My Tasks</h4>
            </div>

            <div class="card-body">

                <!-- Task List -->
                <div class="list-group">

                    <!-- High Priority Task -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">Complete Assignment</h6>
                            <small class="text-muted">Finish the Bootstrap assignment</small>
                        </div>

                        <span class="badge bg-danger">High</span>
                    </div>

                    <!-- Medium Priority Task -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">Study JavaScript</h6>
                            <small class="text-muted">Practice arrays and functions</small>
                        </div>

                        <span class="badge bg-warning text-dark">Medium</span>
                    </div>

                    <!-- Low Priority Task -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">Organize Notes</h6>
                            <small class="text-muted">Arrange notes by topic</small>
                        </div>

                        <span class="badge bg-success">Low</span>
                    </div>

                </div>

                <!-- Completed Button with Badge -->
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-primary">
                        Completed
                        <span class="badge bg-light text-primary ms-1">2</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
