<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-heading">Shadows and Depth Effect</h1>

    <div class="card-container">

        <div class="card card1">
            <h2>Profile Card</h2>
            <p>This card uses a soft box-shadow to create depth.</p>
            <button>View Profile</button>
        </div>

        <div class="card card2">
            <h2>Content Card</h2>
            <p>This card uses a stronger shadow effect for elevation.</p>
            <button>Read More</button>
        </div>

        <div class="card card3">
            <h2>Feature Card</h2>
            <p>This card demonstrates a colorful shadow style.</p>
            <button>Explore</button>
        </div>

    </div>

</body>
</html>
