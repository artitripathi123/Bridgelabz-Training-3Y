<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid">
            <h2>Solid Border</h2>
            <p>Solid border with 20px padding.</p>
        </div>

        <div class="box dashed">
            <h2>Dashed Border</h2>
            <p>Dashed border with 30px padding.</p>
        </div>

        <div class="box double">
            <h2>Double Border</h2>
            <p>Double border with 15px padding.</p>
        </div>

        <div class="box groove">
            <h2>Groove Border</h2>
            <p>Groove border with 25px padding.</p>
        </div>

        <div class="box rounded">
            <h2>Rounded Corners</h2>
            <p>Uses border-radius for rounded corners.</p>
        </div>

    </div>

</body>
</html>
