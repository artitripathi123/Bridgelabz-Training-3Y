<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Advanced CSS Selectors</h1>

    <section class="container">

        <h2>Attribute Selectors</h2>

        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter your email">

        <p>
            <a href="https://www.google.com">Secure HTTPS Link</a>
        </p>

        <h2>Item List</h2>

        <ul class="items">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
            <li>Java</li>
        </ul>

        <h2>Combinators Demonstration</h2>

        <div class="parent">
            <p>Direct child paragraph</p>

            <div>
                <p>Descendant paragraph</p>
            </div>

            <p>Paragraph after div</p>
            <p>Another paragraph</p>
        </div>

        <h2>Focus Example</h2>
        <input type="text" placeholder="Click here to focus">

    </section>

</body>
</html>
