<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Height and Width Practice Layout</h1>

    <div class="container">

        <div class="box box1">
            <h2>Box 1</h2>
            <p>Width: 200px | Height: 150px</p>
        </div>

        <div class="box box2">
            <h2>Box 2</h2>
            <p>Width: 40% | Height: 25vh</p>
            <p>This box demonstrates percentage and viewport units.</p>
        </div>

        <div class="box box3">
            <h2>Box 3</h2>
            <p>Width: 15em | Min-height and Max-width</p>
            <p>Overflow property is demonstrated with extra content inside this box.</p>
        </div>

    </div>

</body>
</html>
