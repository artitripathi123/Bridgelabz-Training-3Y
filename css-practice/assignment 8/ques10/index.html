<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Mini UI</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="main-card">

            <div class="image-section">
                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=400"
                     alt="Workspace Image">
            </div>

            <div class="form-section">
                <h2>Contact Us</h2>
                <p>Fill out the form below to get in touch.</p>

                <form>
                    <input type="text" placeholder="Enter your name" required>
                    <input type="email" placeholder="Enter your email" required>
                    <textarea placeholder="Enter your message" rows="4"></textarea>

                    <div class="buttons">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Mini UI Layout | All Rights Reserved</p>
    </footer>

</body>
</html>
