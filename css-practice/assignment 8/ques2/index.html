<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Tooltip Demonstration</h1>

    <div class="container">

        <div class="tooltip-box">
            <span>HTML</span>
            <div class="tooltip">HyperText Markup Language</div>
        </div>

        <div class="tooltip-box">
            <span>CSS</span>
            <div class="tooltip">Cascading Style Sheets</div>
        </div>

        <div class="tooltip-box">
            <span>JS</span>
            <div class="tooltip">JavaScript Programming</div>
        </div>

        <div class="tooltip-box">
            <span>💡</span>
            <div class="tooltip">Hover to see the tooltip</div>
        </div>

    </div>

</body>
</html>
