<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Combined CSS Effects</h1>
        <p>Hover over the elements to see transitions and transformations.</p>

        <div class="effects">

            <div class="effect-card">
                <h2>Button Effect</h2>
                <button class="grow-btn">Hover Me</button>
            </div>

            <div class="effect-card">
                <h2>Card Effect</h2>
                <div class="hover-card">
                    Move your mouse here
                </div>
            </div>

            <div class="effect-card">
                <h2>Link Effect</h2>
                <a href="#" class="animated-link">Explore More</a>
            </div>

        </div>
    </div>

</body>
</html>
