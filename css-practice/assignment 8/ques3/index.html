<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Showcase</h1>

    <div class="gallery">

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Nature">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1519904981063-b0cf448d479e" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Lake</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" alt="Hills">
                <div class="overlay"></div>
            </div>
            <figcaption>Snowy Hills</figcaption>
        </figure>

    </div>

</body>
</html>
