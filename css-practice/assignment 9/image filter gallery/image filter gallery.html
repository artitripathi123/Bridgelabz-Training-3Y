<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Image Filter Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/id/1015/400/300" class="blur" alt="Mountain">
            <figcaption>Blur Effect</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1016/400/300" class="grayscale" alt="Nature">
            <figcaption>Grayscale Effect</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1025/400/300" class="sepia" alt="Dog">
            <figcaption>Sepia Effect</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1035/400/300" class="brightness" alt="River">
            <figcaption>Brightness Effect</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1043/400/300" class="contrast" alt="Forest">
            <figcaption>Contrast Effect</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1069/400/300" class="hue" alt="Building">
            <figcaption>Hue-Rotate Effect</figcaption>
        </figure>

    </div>

</body>
</html>
