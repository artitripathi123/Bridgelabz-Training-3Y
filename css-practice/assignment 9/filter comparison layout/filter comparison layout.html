```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Filter Comparison</h1>
        <p class="intro">
            Compare the original image with a filtered version.
            Hover over the filtered image to remove the effect.
        </p>

        <div class="comparison">

            <!-- Original Image -->
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/700/450"
                     alt="Original Image">
                <h2>Before</h2>
                <p>Original image without any filter.</p>
            </div>

            <!-- Filtered Image -->
            <div class="image-box filtered">
                <img src="https://picsum.photos/id/1015/700/450"
                     alt="Filtered Image">
                <h2>After</h2>
                <p>Brightness filter is applied. Hover to remove it.</p>
            </div>

        </div>

    </div>

</body>
</html>
```
