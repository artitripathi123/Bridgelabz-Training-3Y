<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 40px;
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #172554;
            font-size: 40px;
            margin-bottom: 40px;
        }

        /* Gallery */
        .gallery {
            max-width: 1200px;
            margin: auto;

            display: grid;

            /* Responsive columns */
            grid-template-columns: repeat(3, 1fr);

            gap: 25px;
        }

        /* Image Box */
        .photo {
            position: relative;
            overflow: hidden;

            height: 250px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            background-color: white;
        }

        /* Image */
        .photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.4s ease;
        }

        /* Hover Image Scale */
        .photo:hover img {
            transform: scale(1.1);
        }

        /* Caption Overlay */
        .caption {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            padding: 15px;

            background-color: rgba(0, 0, 0, 0.7);
            color: white;

            text-align: center;
            font-size: 18px;
            font-weight: bold;

            opacity: 0;

            transition: opacity 0.4s ease;
        }

        /* Show Caption on Hover */
        .photo:hover .caption {
            opacity: 1;
        }

        /* Tablet */
        @media (max-width: 900px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }

        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <!-- Photo 1 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <!-- Photo 2 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <!-- Photo 3 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                 alt="Nature">
            <div class="caption">Amazing Nature</div>
        </div>

        <!-- Photo 4 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e"
                 alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <!-- Photo 5 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Lake">
            <div class="caption">Beautiful Lake</div>
        </div>

        <!-- Photo 6 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                 alt="Mountains">
            <div class="caption">Snowy Mountains</div>
        </div>

    </div>

</body>
</html>
