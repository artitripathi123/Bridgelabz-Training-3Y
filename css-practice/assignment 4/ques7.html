<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background-color: #e0f2fe;
            color: #172554;
        }

        /* Contact Form Container */
        .contact-container {
            width: 90%;
            max-width: 550px;

            padding: 35px;

            background-color: white;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* Heading */
        .contact-container h1 {
            text-align: center;

            margin-bottom: 10px;

            font-size: 32px;
            color: #172554;
        }

        .contact-container > p {
            text-align: center;

            margin-bottom: 30px;

            color: #64748b;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        /* Labels */
        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
            color: #334155;
        }

        /* Inputs and Textarea */
        input,
        textarea {
            width: 100%;

            padding: 12px 15px;

            border: 2px solid #cbd5e1;
            border-radius: 8px;

            background-color: #f8fafc;
            color: #172554;

            font-size: 16px;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

            outline: none;

            transition: border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        /* Focus Effect */
        input:focus,
        textarea:focus {
            border-color: #2563eb;

            box-shadow: 0 0 6px rgba(37, 99, 235, 0.3);

            background-color: white;
        }

        /* Textarea */
        textarea {
            height: 140px;
            resize: vertical;
        }

        /* Submit Button */
        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background-color: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Responsive */
        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .contact-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Contact Form -->
    <div class="contact-container">

        <h1>Contact Us</h1>

        <p>We would love to hear from you!</p>

        <form>

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <!-- Submit -->
            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</body>
</html>
