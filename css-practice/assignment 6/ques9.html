<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        /* Perspective container */
        .card-container {
            perspective: 1000px;
        }

        /* Card */
        .card {
            width: 300px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        /* Flip card on hover */
        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Front side */
        .card-front {
            background-color: white;
            text-align: center;
        }

        .card-front img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .card-front h2 {
            padding: 20px;
            color: #222;
        }

        /* Back side */
        .card-back {
            background-color: #00adb5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            transform: rotateY(180deg);
        }

        .card-back h2 {
            margin-bottom: 15px;
        }

        .card-back p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->
            <div class="card-front">
                <img src="https://picsum.photos/300/280" alt="Nature Image">
                <h2>Explore Nature</h2>
            </div>

            <!-- Back Side -->
            <div class="card-back">
                <div>
                    <h2>About Nature</h2>
                    <p>
                        Nature provides peace, beauty, and inspiration.
                        Explore the wonderful world around us.
                    </p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
