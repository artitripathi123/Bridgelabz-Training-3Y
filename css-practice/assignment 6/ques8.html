<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        figure {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption {
            text-align: center;
            padding: 15px;
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1016/400/300" alt="Nature">
            <figcaption>Peaceful Nature</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1018/400/300" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1019/400/300" alt="Landscape">
            <figcaption>Scenic Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1020/400/300" alt="River">
            <figcaption>Calm River</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1024/400/300" alt="Animal">
            <figcaption>Wildlife</figcaption>
        </figure>

    </div>

</body>
</html>
