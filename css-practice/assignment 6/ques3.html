<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #222;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            color: #00adb5;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .box {
            flex: 1;
            min-width: 220px;
            max-width: 350px;
            padding: 50px 30px;
            background-color: #00adb5;
            color: white;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        .box h2 {
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        /* Responsive Layout */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 90%;
                max-width: 400px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="box">
            <h2>Services</h2>
            <p>We provide quality services.</p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>Explore our latest projects.</p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>Get in touch with us.</p>
        </div>
    </main>

    <footer>
        <p>© 2026 Homepage. All Rights Reserved.</p>
    </footer>

</body>
</html>
