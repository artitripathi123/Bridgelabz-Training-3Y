<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            color: white;
            padding: 20px 50px;
        }

        header h1 {
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: #00adb5;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 50px;
        }

        .about {
            flex: 1;
            max-width: 500px;
        }

        .about h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #222;
        }

        .about p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #00adb5;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            main {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }

            .about {
                max-width: 100%;
            }

            .image-section img {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Arti Mini</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="about">
            <h2>About Me</h2>
            <p>
                Hello! I am Arti, a passionate cybersecurity student
                interested in web development, programming, networking,
                and ethical hacking. I enjoy learning new technologies
                and building creative projects.
            </p>
        </section>

        <section class="image-section">
            <img src="https://via.placeholder.com/300" alt="Profile Image">
        </section>
    </main>

    <footer>
        <p>© 2026 Arti Mini. All Rights Reserved.</p>
    </footer>

</body>
</html>
