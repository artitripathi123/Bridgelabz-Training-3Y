<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .product-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .product-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            /* Equal height cards */
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }

        .product-card p {
            font-size: 18px;
            color: #007bff;
            font-weight: bold;
        }

        /* Tablet: 2 columns */
        @media (max-width: 900px) {
            .product-gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile: 1 column */
        @media (max-width: 600px) {
            .product-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="product-gallery">

        <div class="product-card">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>

        <div class="product-card">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="product-card">
            <h2>Headphones</h2>
            <p>₹2,000</p>
        </div>

        <div class="product-card">
            <h2>Smartwatch</h2>
            <p>₹4,500</p>
        </div>

        <div class="product-card">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="product-card">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="product-card">
            <h2>Monitor</h2>
            <p>₹12,000</p>
        </div>

        <div class="product-card">
            <h2>Tablet</h2>
            <p>₹18,000</p>
        </div>

    </div>

</body>
</html>
